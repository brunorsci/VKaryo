name: deconvolution
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - pandas=2.0
  - numpy=1.24
  - scipy=1.11
  - scikit-learn=1.3
  - matplotlib=3.7
  - seaborn=0.12
  - plotly=5.14
  - pysam=0.21

  # Deconvolution tools
  - pip
  - pip:
    - anndata>=0.9
    - scanpy>=1.9
    - scvi-tools>=1.0  # For Cell2location
    - cell2location>=0.1
    - CIBERSORTx  # May need manual installation
    - MuSiC-python  # Alternative: use R version
